[tool.poetry]
name = "reader"
version = "0.1.0"
description = ""
authors = ["Andrey Chernikov"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.111"
pydantic = "^2.5"
pymorphy2 = "^0.9.1"
pymorphy2-dicts-ru = "^2.4.417127"
uvicorn = "^0.17.6"
nltk = "^3.8"
redis = "^5.0.0b3"
aioredis = "^2.0.1"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
pydantic-settings = "^2.2.1"
google-cloud-texttospeech = "^2.16.3"
langdetect = "^1.0.9"

[tool.poetry.dev-dependencies]
flake8 = "^4.0.1"
isort = "^5.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
src_paths = ["app", "utils", "settings", "api"]
line_length = 120