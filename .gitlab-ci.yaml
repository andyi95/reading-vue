variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME
    GIT_STRATEGY: 'fetch'
    GIT_CHECKOUT: 'true'
    GIT_CLEAN_FLAGS: 'none'
    GIT_DEPTH: 0
    CI_DEBUG_TRACE: "true"

stages:
    - build
    - test
    - deploy

.docker_build: &docker-build
    stage: build
    tags:
        - docker
    before_script:
        - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD registry.andyi95.com
        - |
            if [ -n "$(git tag --points-at HEAD)" ]; then
              export APP_VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))
            else
              export APP_VERSION=$(git rev-parse --short HEAD)
            fi
            export COMPOSE_FILE=docker-compose.yaml:docker-compose.stage.yaml

build:frontend:
    <<: *docker-build
    script:
        - docker build -t registry.andyi95.com/text-tools/reading-frontend:$CI_COMMIT_SHORT_SHA -t registry.andyi95.com/text-tools/reading-frontend:latest -f frontend/stage.Dockerfile frontend/
        - docker push registry.andyi95.com/text-tools/reading-frontend:$CI_COMMIT_SHORT_SHA
        - docker push registry.andyi95.com/text-tools/reading-frontend:latest

build:backend:
    <<: *docker-build
    script:
        - docker build -t registry.andyi95.com/text-tools/reading-backend:$CI_COMMIT_SHORT_SHA -t registry.andyi95.com/text-tools/reading-backend:latest -f backend/Dockerfile backend/
        - docker push registry.andyi95.com/text-tools/reading-backend:$CI_COMMIT_SHORT_SHA
        - docker push registry.andyi95.com/text-tools/reading-backend:latest

test-image:
    stage: test
    tags:
        - docker
    script:
        - app/stage/test
    needs:
        - build:backend
        - build:frontend

deploy:development:
    stage: deploy
    when: manual
    script:
        - app/stage/deploy $APP_VERSION
    needs:
        - test-image
    environment:
        name: development
        deployment_tier: development
        url: https://reader.dev.andyi95.com/

deploy:production:
    stage: deploy
    when: manual
    script:
        - app/stage/deploy $APP_VERSION
    needs:
        - test-image
    environment:
        name: production
        deployment_tier: production
        url: https://text-tools.ru/
