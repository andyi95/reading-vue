variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME
    GIT_STRATEGY: 'fetch'
    GIT_CHECKOUT: 'true'
    GIT_CLEAN_FLAGS: 'none'
    GIT_DEPTH: 0

stages:
    - build
    - test
    - deploy

.docker_build: &docker-build
    stage: build
    before_script:
        - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD registry.andyi95.com
        - |
            if [ -n "$(git tag --points-at HEAD)" ]; then
              export APP_VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))
            else
              export APP_VERSION=$(git rev-parse --short HEAD)
            fi
            export COMPOSE_FILE=docker-compose.yaml:docker-compose.stage.yaml

build:frontend:
    <<: *docker-build
    stage: build
    script:
        docker compose build --no-cache frontend

build:backend:
    <<: *docker-build
    stage: build
    script:
        docker compose build --no-cache backend

test-image:
    stage: test
    script:
        - app/stage/test
    needs:
        - build:backend
        - build:frontend

deploy:development:
    stage: deploy
    script:
        - app/stage/deploy
    needs:
        - test_image
    environment:
        name: development
        url: https://reader.dev.andyi95.com/

deploy:production:
    stage: deploy
    script:
        - app/stage/deploy
    needs:
        - test_image
    environment:
        name: production
        url: https://text-tools.ru/
