version: '3.4'
services:
    frontend:
        image: registry.andyi95.com/text-tools/reading-frontend:${APP_VERSION}
        build:
            context: frontend
            dockerfile: stage.Dockerfile
        restart: unless-stopped

    backend:
        image: registry.andyi95.com/text-tools/reading-backend:${APP_VERSION}
        restart: unless-stopped

    nginx:
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.reader.rule=Host(`${DEPLOYMENT_HOST:-reader.home.andyi95.com}`)"
            - "traefik.http.services.reader.loadbalancer.server.port=80"
            - "traefik.http.middlewares.reader.headers.customrequestheaders.X-Forwarded-Proto=https,wss"
